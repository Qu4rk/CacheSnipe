<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <title>CacheSnipe Architecture and Hook Pipeline</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#161b26" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Grid pattern overlay -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
    <line x1="1100" y1="0" x2="1100" y2="480" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- Header / Badge -->
  <g transform="translate(48, 36)">
    <rect width="136" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
    <text x="68" y="17" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">HOOK PIPELINE</text>
    <text x="156" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">How CacheSnipe Locks OpenCode's Prompt Prefix</text>
  </g>

  <!-- Flow Columns: Left (OpenCode Hooks), Middle (CacheSnipe Pillars), Right (DeepSeek Result) -->

  <!-- Card 1: System Transform -->
  <g transform="translate(48, 86)" filter="url(#cardShadow)">
    <rect width="320" height="74" rx="10" fill="#1c212e" stroke="#3b4354" stroke-width="1.5" />
    <text x="18" y="28" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">experimental.chat.system</text>
    <text x="18" y="50" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Intercepts system prompt and env tags</text>
  </g>

  <!-- Card 2: Messages Transform -->
  <g transform="translate(48, 178)" filter="url(#cardShadow)">
    <rect width="320" height="74" rx="10" fill="#1c212e" stroke="#3b4354" stroke-width="1.5" />
    <text x="18" y="28" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">experimental.chat.messages</text>
    <text x="18" y="50" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Monitors message chain per request</text>
  </g>

  <!-- Card 3: Compacting Hook -->
  <g transform="translate(48, 270)" filter="url(#cardShadow)">
    <rect width="320" height="74" rx="10" fill="#1c212e" stroke="#3b4354" stroke-width="1.5" />
    <text x="18" y="28" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">experimental.session.compacting</text>
    <text x="18" y="50" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Manages session history consolidation</text>
  </g>

  <!-- Card 4: Event Hook -->
  <g transform="translate(48, 362)" filter="url(#cardShadow)">
    <rect width="320" height="74" rx="10" fill="#1c212e" stroke="#3b4354" stroke-width="1.5" />
    <text x="18" y="28" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">event (assistant message)</text>
    <text x="18" y="50" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Reads cache.read/write tokens and cost</text>
  </g>

  <!-- Connectors from Hooks to Engine -->
  <path d="M 368 123 L 428 123" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3" />
  <path d="M 368 215 L 428 215" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3" />
  <path d="M 368 307 L 428 307" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3" />
  <path d="M 368 399 L 428 399" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Middle Column: CacheSnipe Engine -->
  <g transform="translate(428, 86)" filter="url(#cardShadow)">
    <rect width="380" height="74" rx="10" fill="#1e1833" stroke="#7c3aed" stroke-width="1.5" />
    <text x="18" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">P0 Date Freeze + P0b Block Hashing</text>
    <text x="18" y="50" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Persists session date; detects skill/mcp drift</text>
  </g>

  <g transform="translate(428, 178)" filter="url(#cardShadow)">
    <rect width="380" height="74" rx="10" fill="#1e1833" stroke="#7c3aed" stroke-width="1.5" />
    <text x="18" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">P2 Prefix Guard and Classification</text>
    <text x="18" y="50" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Verifies extension; flags rewinds vs divergence</text>
  </g>

  <g transform="translate(428, 270)" filter="url(#cardShadow)">
    <rect width="380" height="74" rx="10" fill="#1e1833" stroke="#7c3aed" stroke-width="1.5" />
    <text x="18" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">P3 Prune Disabler and Fast Compaction</text>
    <text x="18" y="50" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Keeps prune=false; pins flash at temp 0</text>
  </g>

  <g transform="translate(428, 362)" filter="url(#cardShadow)">
    <rect width="380" height="74" rx="10" fill="#1e1833" stroke="#7c3aed" stroke-width="1.5" />
    <text x="18" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">P1 Telemetry and Reporting Store</text>
    <text x="18" y="50" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Feeds /cache-stats and /cache-graph trends</text>
  </g>

  <!-- Connectors from Engine to DeepSeek Result -->
  <path d="M 808 123 L 870 215" stroke="#10b981" stroke-width="2" />
  <path d="M 808 215 L 870 240" stroke="#10b981" stroke-width="2" />
  <path d="M 808 307 L 870 265" stroke="#10b981" stroke-width="2" />
  <path d="M 808 399 L 870 320" stroke="#10b981" stroke-width="2" />

  <!-- Right Column: Result / Benefit Card -->
  <g transform="translate(870, 86)" filter="url(#cardShadow)">
    <rect width="282" height="350" rx="12" fill="#0d231b" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Inner Accent Box -->
    <rect x="20" y="24" width="242" height="42" rx="8" fill="#10b981" fill-opacity="0.15" />
    <text x="141" y="44" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">OFFICIAL DEEPSEEK API</text>
    <text x="141" y="58" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">api.deepseek.com</text>

    <!-- Main Stat 1 -->
    <text x="24" y="105" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">INPUT CACHE DISCOUNT</text>
    <text x="24" y="136" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="800">50x to 120x</text>
    <text x="24" y="156" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">flash $0.003/M | pro $0.003625/M</text>

    <line x1="24" y1="176" x2="258" y2="176" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />

    <!-- Main Stat 2 -->
    <text x="24" y="202" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">WARM TURN RETENTION</text>
    <text x="24" y="233" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="800">&gt;= 90% Hits</text>
    <text x="24" y="253" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">0 lost prefix tokens on turns 2+</text>

    <line x1="24" y1="273" x2="258" y2="273" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />

    <!-- Verified Badge -->
    <g transform="translate(24, 292)">
      <circle cx="10" cy="10" r="10" fill="#10b981" />
      <path d="M 6 10 L 9 13 L 14 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">Zero Local Prefix Breaks</text>
    </g>
    <text x="24" y="328" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Electron Node runtime (no Bun)</text>
  </g>
</svg>
