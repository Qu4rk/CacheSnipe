<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">CacheSnipe Architecture and Hook Pipeline</title>
  <desc id="flowDesc">Architecture diagram showing how CacheSnipe intercepts OpenCode transforms to freeze dates, prevent history pruning, and lock prompt prefixes for DeepSeek caching.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#131b26" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="620" rx="16" fill="url(#bgGrad)" stroke="#263142" stroke-width="1.5" />

  <!-- Subtle Structural Grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.035">
    <line x1="100" y1="0" x2="100" y2="620" />
    <line x1="200" y1="0" x2="200" y2="620" />
    <line x1="300" y1="0" x2="300" y2="620" />
    <line x1="400" y1="0" x2="400" y2="620" />
    <line x1="500" y1="0" x2="500" y2="620" />
    <line x1="600" y1="0" x2="600" y2="620" />
    <line x1="700" y1="0" x2="700" y2="620" />
    <line x1="800" y1="0" x2="800" y2="620" />
    <line x1="900" y1="0" x2="900" y2="620" />
    <line x1="1000" y1="0" x2="1000" y2="620" />
    <line x1="1100" y1="0" x2="1100" y2="620" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Header Block -->
  <g transform="translate(48, 38)">
    <rect width="138" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1" />
    <text x="69" y="19" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">HOOK PIPELINE</text>
    <text x="156" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="800">How CacheSnipe Locks OpenCode's Prompt Prefix</text>
  </g>

  <!-- Left Column: OpenCode Hooks (x=48, w=330) -->
  <!-- Card 1: System Transform -->
  <g transform="translate(48, 98)" filter="url(#cardShadow)">
    <rect width="330" height="96" rx="10" fill="#151b27" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="36" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">experimental.chat.system</text>
    <text x="20" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">Intercepts system prompt &amp; env tags</text>
    <text x="20" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Isolates dynamic date line on turn 1</text>
  </g>

  <!-- Card 2: Messages Transform -->
  <g transform="translate(48, 222)" filter="url(#cardShadow)">
    <rect width="330" height="96" rx="10" fill="#151b27" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="36" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">experimental.chat.messages</text>
    <text x="20" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">Monitors message prefix chain</text>
    <text x="20" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Calculates rolling SHA-256 history hashes</text>
  </g>

  <!-- Card 3: Compacting Hook -->
  <g transform="translate(48, 346)" filter="url(#cardShadow)">
    <rect width="330" height="96" rx="10" fill="#151b27" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="36" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">experimental.session.compacting</text>
    <text x="20" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">Guards compaction lifecycle</text>
    <text x="20" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Disables prune; steers to flash at temp 0</text>
  </g>

  <!-- Card 4: Event Hook -->
  <g transform="translate(48, 470)" filter="url(#cardShadow)">
    <rect width="330" height="96" rx="10" fill="#151b27" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="36" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">event (assistant message)</text>
    <text x="20" y="62" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">Tracks real token telemetry</text>
    <text x="20" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Extracts cache.read, miss input, and cost</text>
  </g>

  <!-- Connectors Left to Middle -->
  <path d="M 378 146 L 430 146" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="5 4" />
  <path d="M 378 270 L 430 270" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="5 4" />
  <path d="M 378 394 L 430 394" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="5 4" />
  <path d="M 378 518 L 430 518" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="5 4" />

  <!-- Middle Column: CacheSnipe Core (x=430, w=410) -->
  <!-- Card 1: P0 + P0b -->
  <g transform="translate(430, 98)" filter="url(#cardShadow)">
    <rect width="410" height="96" rx="10" fill="#1e1833" stroke="#7c3aed" stroke-width="1.5" />
    <text x="20" y="36" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">P0 Date Freeze + P0b Hashing</text>
    <text x="20" y="62" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">Persists session date on disk; attributes drift</text>
    <text x="20" y="82" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Resumed sessions keep identical token 0 across days</text>
  </g>

  <!-- Card 2: P2 -->
  <g transform="translate(430, 222)" filter="url(#cardShadow)">
    <rect width="410" height="96" rx="10" fill="#1e1833" stroke="#7c3aed" stroke-width="1.5" />
    <text x="20" y="36" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">P2 Prefix Guard &amp; Classifier</text>
    <text x="20" y="62" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">Validates extensions; classifies rewinds vs breaks</text>
    <text x="20" y="82" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Allows safe /undo retries without false alarms</text>
  </g>

  <!-- Card 3: P3 -->
  <g transform="translate(430, 346)" filter="url(#cardShadow)">
    <rect width="410" height="96" rx="10" fill="#1e1833" stroke="#7c3aed" stroke-width="1.5" />
    <text x="20" y="36" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">P3 Safe Compaction Enforcer</text>
    <text x="20" y="62" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">Enforces prune=false in OpenCode config</text>
    <text x="20" y="82" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Prevents destructive history wiping of past tool outputs</text>
  </g>

  <!-- Card 4: P1 -->
  <g transform="translate(430, 470)" filter="url(#cardShadow)">
    <rect width="410" height="96" rx="10" fill="#1e1833" stroke="#7c3aed" stroke-width="1.5" />
    <text x="20" y="36" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">P1 Telemetry &amp; Reporting Store</text>
    <text x="20" y="62" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">Renders live /cache-stats and /cache-graph</text>
    <text x="20" y="82" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Atomic file writes support concurrent OpenCode windows</text>
  </g>

  <!-- Connectors Middle to Right -->
  <path d="M 840 146 L 890 240" stroke="#10b981" stroke-width="2.5" />
  <path d="M 840 270 L 890 275" stroke="#10b981" stroke-width="2.5" />
  <path d="M 840 394 L 890 320" stroke="#10b981" stroke-width="2.5" />
  <path d="M 840 518 L 890 390" stroke="#10b981" stroke-width="2.5" />

  <!-- Right Column: Result Card (x=890, w=262, h=468, y=98) -->
  <g transform="translate(890, 98)" filter="url(#cardShadow)">
    <rect width="262" height="468" rx="12" fill="#0b2219" stroke="#10b981" stroke-width="1.8" />
    
    <!-- Top Pill -->
    <rect x="18" y="24" width="226" height="46" rx="8" fill="#10b981" fill-opacity="0.18" />
    <text x="131" y="45" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">OFFICIAL DEEPSEEK API</text>
    <text x="131" y="61" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">api.deepseek.com</text>

    <!-- Main Stat 1 -->
    <text x="24" y="112" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">INPUT CACHE DISCOUNT</text>
    <text x="24" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="800">50x to 120x</text>
    <text x="24" y="174" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">flash $0.003/M | pro $0.003625/M</text>

    <line x1="24" y1="202" x2="238" y2="202" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2" />

    <!-- Main Stat 2 -->
    <text x="24" y="234" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">WARM TURN RETENTION</text>
    <text x="24" y="274" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="800">&gt;= 90% Hits</text>
    <text x="24" y="296" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">0 lost prefix tokens on turns 2+</text>

    <line x1="24" y1="326" x2="238" y2="326" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2" />

    <!-- Checkmark Badge -->
    <g transform="translate(24, 356)">
      <circle cx="12" cy="12" r="12" fill="#10b981" />
      <path d="M 7 12 L 10 15 L 17 9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="32" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Zero Local Breaks</text>
    </g>
    
    <text x="24" y="412" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Persistent session date across days</text>
    <text x="24" y="434" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">Electron Node runtime (no Bun)</text>
  </g>
</svg>
