<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <title>DeepSeek 128-Token Block Cache Comparison</title>
  <defs>
    <linearGradient id="compBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#151923" />
    </linearGradient>
    <filter id="shadowBox" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="460" rx="16" fill="url(#compBgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect width="180" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
    <text x="90" y="17" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">CACHE MECHANISM</text>
    <text x="200" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">DeepSeek 128-Token Block Alignment in OpenCode</text>
  </g>

  <!-- Top Scenario: Without CacheSnipe (Cache Bust) -->
  <g transform="translate(48, 85)" filter="url(#shadowBox)">
    <rect width="1104" height="155" rx="10" fill="#1b171c" stroke="#f85149" stroke-width="1.2" />

    <!-- Label row -->
    <rect x="20" y="16" width="180" height="24" rx="4" fill="#f85149" fill-opacity="0.2" />
    <text x="110" y="32" fill="#ff7b72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">WITHOUT CACHESNIPE</text>
    <text x="215" y="32" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Day rollover, skills drift, or prune rewrites token 40 -> entire subsequent chain busts</text>

    <!-- Token visual row -->
    <g transform="translate(20, 56)">
      <!-- Block 0-128: Broken -->
      <rect x="0" y="0" width="140" height="44" rx="6" fill="#4c1d24" stroke="#f85149" stroke-width="1" />
      <text x="70" y="22" fill="#ff7b72" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Block 0: env/date</text>
      <text x="70" y="36" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" text-anchor="middle">1-byte drift at token 40</text>

      <text x="155" y="26" fill="#f85149" font-family="sans-serif" font-size="16" font-weight="bold">-&gt;</text>

      <!-- Block 128-50k+: All Missed -->
      <rect x="180" y="0" width="700" height="44" rx="6" fill="#3b1d22" stroke="#f85149" stroke-width="1" stroke-dasharray="5 3" />
      <text x="530" y="22" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">50,000+ Tokens of Conversation History and Tool Outputs (100% Cache Miss)</text>
      <text x="530" y="37" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Prefix broken: DeepSeek cannot match subsequent 128-token blocks</text>

      <!-- Cost Badge -->
      <rect x="900" y="0" width="164" height="44" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
      <text x="982" y="20" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600" text-anchor="middle">BILLED AS FRESH INPUT</text>
      <text x="982" y="37" fill="#ffffff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">$0.435 / 1M</text>
    </g>

    <text x="20" y="132" fill="#ff7b72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Result: Every turn pays full cold input price. 20-turn agent session easily burns through dollars.</text>
  </g>

  <!-- Bottom Scenario: With CacheSnipe (Cache Hit Locked) -->
  <g transform="translate(48, 260)" filter="url(#shadowBox)">
    <rect width="1104" height="165" rx="10" fill="#13231c" stroke="#10b981" stroke-width="1.2" />

    <!-- Label row -->
    <rect x="20" y="16" width="180" height="24" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="110" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">WITH CACHESNIPE</text>
    <text x="215" y="32" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Date frozen, blocks pinned, prune disabled: token 0 to token 50,000+ stays byte-identical</text>

    <!-- Token visual row -->
    <g transform="translate(20, 56)">
      <!-- Frozen Block 0 -->
      <rect x="0" y="0" width="140" height="48" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="70" y="22" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Block 0: Locked</text>
      <text x="70" y="38" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" text-anchor="middle">Date &amp; env frozen</text>

      <!-- Blocks 1..N: Cached -->
      <rect x="150" y="0" width="600" height="48" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="450" y="22" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">50,000+ Tokens Contiguous Match: 128-Token KV Cache Hits (99%+ Hit Rate)</text>
      <text x="450" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Billed at DeepSeek Cache-Read rate: $0.003625 / 1M (120x cheaper!)</text>

      <!-- Tail Block: Just the new turn -->
      <rect x="760" y="0" width="120" height="48" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="820" y="22" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">Tail (~180 tok)</text>
      <text x="820" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" text-anchor="middle">Fresh turn input</text>

      <!-- Cost Badge -->
      <rect x="900" y="0" width="164" height="48" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <text x="982" y="20" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CACHE-HIT PRICING</text>
      <text x="982" y="39" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">$0.0036 / 1M</text>
    </g>

    <text x="20" y="142" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Result: 90% to 99% cost reduction. 7.45 million tokens processed for only $0.19.</text>
  </g>
</svg>
